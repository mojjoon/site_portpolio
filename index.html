<style>
:root{--bg:#000;--ink:#eef1f7;--mute:#8993a8;--blue:#2f7bff;--blue-soft:rgba(47,123,255,.16);--line:#182032;--card:#06090f;
--display:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;--body:'Bricolage Grotesque',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.7;overflow-x:hidden}
html.has-cursor,html.has-cursor *{cursor:none!important}
.c-dot,.c-ring{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;border-radius:50%;opacity:0;transition:opacity .25s}
.c-dot{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--blue);box-shadow:0 0 14px 2px rgba(47,123,255,.7)}
.c-ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1.5px solid var(--blue);transition:width .25s,height .25s,margin .25s,background .25s,opacity .25s}
html.has-cursor .c-dot,html.has-cursor .c-ring{opacity:1}
.c-ring.big{width:64px;height:64px;margin:-32px 0 0 -32px;background:var(--blue-soft)}
.c-ring.down{width:26px;height:26px;margin:-13px 0 0 -13px}
.c-ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem;color:#fff;opacity:0;transition:opacity .2s}
.c-ring.lab{width:76px;height:76px;margin:-38px 0 0 -38px;background:var(--blue-soft)}
.c-ring.lab span{opacity:1}
.ripple{position:fixed;width:10px;height:10px;margin:-5px 0 0 -5px;border:1.5px solid var(--blue);border-radius:50%;pointer-events:none;z-index:9998;animation:rip .7s ease-out forwards}
@keyframes rip{to{transform:scale(10);opacity:0}}
.bar{position:fixed;top:0;left:0;right:0;height:2px;z-index:60;background:var(--blue);transform:scaleX(0);transform-origin:0 50%}
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:20px clamp(20px,5vw,56px);background:linear-gradient(#000 40%,transparent)}
nav .logo{font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--ink);text-decoration:none;letter-spacing:-.02em}
nav .logo i{display:inline-block;width:8px;height:8px;background:var(--blue);border-radius:50%;margin-left:3px}
nav ul{display:flex;gap:22px;list-style:none;align-items:center}
nav a.l{display:inline-block;color:var(--mute);text-decoration:none;font-size:.95rem;transition:color .2s}
nav a.l:hover{color:var(--blue)}nav a.l.on{color:var(--ink)}
nav .k{display:inline-block;color:var(--mute);text-decoration:none;font:inherit;font-size:.82rem;background:none;border:1px solid var(--line);border-radius:99px;padding:2px 12px;cursor:pointer}
nav .k:hover{color:var(--blue);border-color:var(--blue)}
#hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:120px clamp(20px,5vw,56px) 60px}
#net{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;z-index:2;pointer-events:none}
h1{font-family:var(--display);font-size:clamp(3rem,15vw,13rem);line-height:.9;letter-spacing:-.045em;font-weight:300;white-space:nowrap}
h1 span.sp{width:.32em}
h1 span{display:inline-block;transition:color .15s,transform .15s;will-change:transform}
.sub{margin-top:28px;max-width:34rem;color:var(--mute);font-size:clamp(1rem,1.6vw,1.2rem);font-weight:300}
.hint{position:absolute;bottom:28px;left:clamp(20px,5vw,56px);z-index:2;color:#4a5469;font-size:.85rem}
.now{position:absolute;right:clamp(20px,5vw,56px);bottom:28px;z-index:2;max-width:50%;text-align:right;color:#4a5469;font-size:.85rem}
.now a{color:var(--mute);text-decoration:none}.now a:hover{color:var(--blue)}
section.s{padding:110px clamp(20px,5vw,56px);text-align:center}
h2{font-family:var(--display);font-size:.82rem;letter-spacing:.28em;text-transform:uppercase;font-weight:500;color:#5d6882}
.lead{color:var(--mute);margin:14px auto 0;max-width:34rem}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:32px 0 36px}
.chip{background:none;border:1px solid transparent;color:var(--mute);padding:7px 18px;border-radius:99px;font:inherit;font-size:.9rem;transition:background .35s,color .35s,border-color .35s}
.chip:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.chip.on{color:#d6e4ff;background:var(--blue-soft);border-color:rgba(47,123,255,.4)}
.chip small{opacity:.6;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;perspective:1100px}
.card{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;color:inherit;text-decoration:none;overflow:hidden;transition:transform .15s ease-out,border-color .25s;transform-style:preserve-3d}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(47,123,255,.2),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover{border-color:rgba(47,123,255,.55)}.card:hover::before{opacity:1}.card.hide{display:none}
.card h3{font-family:var(--display);font-size:1.4rem;font-weight:600;letter-spacing:-.02em;line-height:1.25;position:relative}
.card p{color:var(--mute);font-size:.93rem;margin-top:10px;position:relative;font-weight:300}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:22px;position:relative}
.tag{font-size:.78rem;color:#9db8ff;background:var(--blue-soft);padding:3px 11px;border-radius:99px}
.thumb{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0a0e16;border:1px solid var(--line)}
#bchips{position:relative;margin:32px 0 36px}.tree{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.tree path{fill:none;stroke:rgba(47,123,255,.5);stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;animation:dr .6s .05s ease-out forwards}
.rw{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;margin-top:30px;position:relative}#r1{margin-top:0}.rw:empty{display:none}.rw+.rw .chip{font-size:.84rem;padding:5px 14px;animation:fo .4s both}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fo{from{opacity:0}}@keyframes fi{from{opacity:0;transform:translateY(-6px)}}
.album .thumb{transition:opacity .24s,transform .24s,filter .24s}.cf-track.out .thumb{opacity:0;transform:translateY(-18px) scale(.94);filter:blur(8px)}
.album.in .thumb{animation:ai .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*55ms)}@keyframes ai{from{opacity:0;transform:translateY(28px) scale(.92);filter:blur(10px)}}
.cf-cap>*{animation:fi .4s both}
.skgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;perspective:1100px;max-width:1100px;margin:44px auto 0}
.sk{transition:transform .15s ease-out,border-color .25s,opacity .35s}.skgrid:hover .sk:not(:hover){opacity:.55}
.sk .no{display:block;position:relative;color:var(--blue);font-size:.78rem;letter-spacing:.12em;margin-bottom:10px}
.sk h3{font-size:1.15rem}.sn{display:block;margin-top:4px;color:#9db8ff;font-size:.78rem;position:relative}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;position:relative}
.pill{display:inline-block;font-size:.86rem;color:#b3bdd2;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:99px;padding:5px 14px;transition:color .25s,border-color .25s,background .25s,transform .25s}
.pill:hover{color:#fff;border-color:rgba(47,123,255,.7);background:var(--blue-soft);transform:translateY(-2px)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}.rv.vis{opacity:1;transform:none}
.rv .pill{opacity:0;transform:translateY(8px)}.rv.vis .pill{opacity:1;transform:none;transition:opacity .5s calc(.25s + var(--i)*50ms),transform .5s calc(.25s + var(--i)*50ms)}
@media(max-width:900px){.skgrid{grid-template-columns:1fr}.skgrid .sk{grid-column:auto!important}}
.acc{max-width:820px;margin:44px auto 0;text-align:left;border-top:1px solid var(--line)}
.ac{position:relative;border-bottom:1px solid var(--line);opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}.ac.vis{opacity:1;transform:none}
.ac::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--blue);transform:scaleX(0);transform-origin:0 50%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}.ac.open::after{transform:scaleX(1)}
.ah{width:100%;display:flex;align-items:center;gap:18px;padding:22px 4px;background:none;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ah .no{color:var(--blue);font-size:.78rem;letter-spacing:.12em;width:26px;flex:none}
.ah .nm{font-family:var(--display);font-size:clamp(1.05rem,2.2vw,1.4rem);font-weight:600;letter-spacing:-.02em;flex:none;transition:color .3s,transform .3s}.ah:hover .nm{color:#fff;transform:translateX(4px)}
.ah .nm small{margin-left:10px;color:#9db8ff;font-size:.75rem;font-weight:400;letter-spacing:0}
.ah .pv{flex:1;min-width:0;color:#566077;font-size:.88rem;font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}.ac.open .pv{opacity:0}
.ah .ct{color:#566077;font-size:.8rem;flex:none}
.ah .pm{position:relative;width:14px;height:14px;flex:none}.pm::before,.pm::after{content:"";position:absolute;left:0;top:6px;width:14px;height:1.5px;background:var(--mute);transition:transform .35s,background .3s}.pm::after{transform:rotate(90deg)}.ah:hover .pm::before,.ah:hover .pm::after{background:var(--blue)}.ac.open .pm::after{transform:rotate(0)}
.ab{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1)}.ac.open .ab{grid-template-rows:1fr}.ab>div{overflow:hidden;min-height:0}
.ab .pills{margin:0;padding:0 4px 26px 44px}
.ac .pill{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s,color .25s,border-color .25s,background .25s}
.ac.open .pill{opacity:1;transform:none;transition-delay:calc(.15s + var(--i)*45ms)}.ac.open .pill:hover{transform:translateY(-2px);transition-delay:0s}
@media(max-width:600px){.ah .pv{display:none}.ah .nm{flex:1}.ab .pills{padding-left:4px}}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.vz{width:100%;height:100%;display:block}.vz *{vector-effect:non-scaling-stroke}
.ln{fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-dasharray:1;animation:dd 4s ease-in-out infinite}
@keyframes dd{0%{stroke-dashoffset:1}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.gl{stroke:#121a2b;stroke-width:1}
.sp{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(24px,5vw,70px);max-width:1100px;margin:48px auto 0;align-items:center;min-height:380px;text-align:left}
.sp ul{list-style:none}.sp li{font-size:clamp(1.8rem,4.4vw,3.2rem);font-weight:300;letter-spacing:-.03em;line-height:1.25;color:#323c52;cursor:pointer;transition:color .35s,transform .35s,font-weight .35s;display:flex;align-items:baseline;gap:14px;outline:none}
.sp li small{font-size:.75rem;color:transparent;letter-spacing:.1em;transition:.35s}
.sp li:hover{color:#5d6882}.sp li.on{color:var(--ink);transform:translateX(10px);font-weight:500}.sp li.on small{color:var(--blue)}
.pn{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;min-height:360px;position:relative;overflow:hidden}
.pn::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at 80% 0%,rgba(47,123,255,.16),transparent 60%);pointer-events:none}
.pn>*{animation:fo2 .45s both;position:relative}.pn .v{height:170px;border-radius:14px;background:#080c14;border:1px solid var(--line);overflow:hidden;margin-bottom:20px;position:relative}
.pn h3{font-family:var(--display);font-size:1.6rem;font-weight:600;letter-spacing:-.02em}.pn p{color:var(--mute);margin:10px 0 20px;font-weight:300}.pn .more{margin-top:20px}
@keyframes fo2{from{opacity:0;transform:translateY(8px)}}
@media(max-width:800px){.sp{grid-template-columns:1fr}}
.arr{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:1.1rem;transition:all .2s;cursor:pointer}
.arr:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.cf{position:relative;height:clamp(330px,42vw,450px);margin:28px calc(-1*clamp(20px,5vw,56px)) 0;perspective:1300px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline:none;
-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.cf-track{position:absolute;inset:0;transform-style:preserve-3d}
.album{position:absolute;left:50%;top:42%;width:clamp(190px,22vw,270px);display:block;color:inherit;text-decoration:none;will-change:transform,opacity}
.album .thumb{aspect-ratio:1;border-radius:12px;-webkit-box-reflect:below 6px linear-gradient(transparent 62%,rgba(0,0,0,.4));box-shadow:0 20px 50px -22px rgba(47,123,255,.4)}
.album .thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.22),transparent 55%);opacity:0;transition:opacity .25s;pointer-events:none}
.album:hover .thumb::after{opacity:1}
.album img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;pointer-events:none}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:16px;text-align:left;background:linear-gradient(145deg,#0d1a33,#05080f 70%)}
.ph b{font-weight:300;font-size:2.4rem;line-height:1;letter-spacing:-.04em;color:var(--blue)}
.ph span{font-size:.95rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cf-ctl{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:8px;color:var(--mute);font-size:.9rem}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:6px}
.dots button{width:22px;height:22px;background:none;border:0;display:grid;place-items:center;cursor:pointer}

.cf-cap{max-width:36rem;min-height:8rem;margin:6px auto 0;text-align:center}

.proj .ico{font-size:1.6rem;margin-bottom:18px;position:relative}
.more{display:inline-block;margin-top:30px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--blue);padding-bottom:2px;transition:color .2s}
.more:hover{color:var(--blue)}.more-wrap{text-align:center}
.mag{transition:transform .25s cubic-bezier(.2,.8,.2,1),color .2s,border-color .2s,background .2s!important}
footer{padding:60px clamp(20px,5vw,56px) 50px;color:#566077;font-size:.88rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
footer a{color:var(--mute);text-decoration:none}footer a:hover{color:var(--blue)}
a:focus-visible,button:focus-visible,.cf:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.ov{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}
.ov.open{opacity:1;pointer-events:auto}
.box{position:relative;text-align:left;width:min(520px,calc(100% - 40px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;transform:scale(.94) translateY(10px);transition:transform .3s}
.ov.open .box{transform:none}
.box .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:none;border:1px solid var(--line);color:var(--ink);font-size:1.1rem;cursor:pointer}

@media(max-width:600px){nav ul{gap:12px}.now{display:none}}

function drawTree(){ /* 선택한 칩에서 하위 칩으로 이어지는 가지 */
  const sv=bchips.querySelector('.tree');if(!sv)return;
  const br=bchips.getBoundingClientRect(),rows=['r1','r2','r3'].map(i=>document.getElementById(i)).filter(r=>r.firstChild);let d='';
  const P=x=>`<path pathLength="1" d="${x}"/>`;
  for(let i=1;i<rows.length;i++){
    const p=rows[i-1].querySelector('.chip.on');if(!p)continue;
    const pr=p.getBoundingClientRect(),px=pr.left+pr.width/2-br.left,py=pr.bottom-br.top;
    const k=[...rows[i].children].map(e=>e.getBoundingClientRect()),ky=k[0].top-br.top,my=(py+ky)/2;
    const xs=k.filter(r=>Math.abs(r.top-br.top-ky)<4).map(r=>r.left+r.width/2-br.left);
    d+=P(`M${px} ${py+2}V${my}`)+P(`M${Math.min(px,...xs)} ${my}H${Math.max(px,...xs)}`)+xs.map(x=>P(`M${x} ${my}V${ky-2}`)).join('');
  }
  sv.innerHTML=d;
}
