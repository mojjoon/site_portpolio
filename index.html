<!DOCTYPE html>
<!--
=====================================================================
[편집 규칙 - 다음 수정 요청 시 반드시 따를 것]
1. 이 파일의 각 구역은 [SEC ID] ... [END SEC ID] 주석으로 감싸져 있습니다.
2. 수정 요청은 "SEC-ID만 교체" 형식으로 합니다. 예: "SEC-JS-G만 교체해줘"
3. 답변은 요청된 구역의 전체 코드만 드립니다. 파일 전체를 다시 출력하지 않습니다.
4. 여러 구역을 고칠 때는 구역별로 나눠서, 각각 "어디를 교체하는지" 표기합니다.
5. 새 구역이 필요하면 기존 ID 체계를 따라 새 ID를 만들고, 위 목록 주석을 함께 갱신합니다.
=====================================================================
-->
<html lang="en">
<!-- [SEC HEAD] 메타, 폰트, 파비콘 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MO JUNHYUN</title>
<meta name="description" content="Portfolio and blog of MO JUNHYUN. Software, tools, and notes on what I learn.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='black'/><circle cx='50' cy='50' r='20' fill='%232f7bff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
<!-- [END SEC HEAD] -->

<style>
/* [SEC CSS-A] 기본 리셋, 커서, 네비, 히어로 */
:root{--bg:#000;--ink:#eef1f7;--mute:#8993a8;--blue:#2f7bff;--blue-soft:rgba(47,123,255,.16);--line:#182032;--card:#06090f;
--display:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;--body:'Bricolage Grotesque',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.7;overflow-x:hidden}
html.has-cursor,html.has-cursor *{cursor:none!important}
.c-dot,.c-ring{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;border-radius:50%;opacity:0;transition:opacity .25s}
.c-dot{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--blue);box-shadow:0 0 14px 2px rgba(47,123,255,.7)}
.c-ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1.5px solid var(--blue);transition:width .25s,height .25s,margin .25s,background .25s,opacity .25s}
html.has-cursor .c-dot,html.has-cursor .c-ring{opacity:1}
.c-ring.big{width:64px;height:64px;margin:-32px 0 0 -32px;background:var(--blue-soft)}
.c-ring.down{width:26px;height:26px;margin:-13px 0 0 -13px}
.c-ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem;color:#fff;opacity:0;transition:opacity .2s}
.c-ring.lab{width:76px;height:76px;margin:-38px 0 0 -38px;background:var(--blue-soft)}
.c-ring.lab span{opacity:1}
.ripple{position:fixed;width:10px;height:10px;margin:-5px 0 0 -5px;border:1.5px solid var(--blue);border-radius:50%;pointer-events:none;z-index:9998;animation:rip .7s ease-out forwards}
@keyframes rip{to{transform:scale(10);opacity:0}}
.bar{position:fixed;top:0;left:0;right:0;height:2px;z-index:60;background:var(--blue);transform:scaleX(0);transform-origin:0 50%}
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:20px clamp(20px,5vw,56px);background:linear-gradient(#000 40%,transparent)}
nav .logo{font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--ink);text-decoration:none;letter-spacing:-.02em}
nav .logo i{display:inline-block;width:8px;height:8px;background:var(--blue);border-radius:50%;margin-left:3px}
nav ul{display:flex;gap:22px;list-style:none;align-items:center}
nav a.l{display:inline-block;color:var(--mute);text-decoration:none;font-size:.95rem;transition:color .2s}
nav a.l:hover{color:var(--blue)}nav a.l.on{color:var(--ink)}
nav .k{display:inline-block;color:var(--mute);text-decoration:none;font:inherit;font-size:.82rem;background:none;border:1px solid var(--line);border-radius:99px;padding:2px 12px;cursor:pointer}
nav .k:hover{color:var(--blue);border-color:var(--blue)}
#hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:120px clamp(20px,5vw,56px) 60px}
#net{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;z-index:2;pointer-events:none}
h1{font-family:var(--display);font-size:clamp(3rem,15vw,13rem);line-height:.9;letter-spacing:-.045em;font-weight:300;white-space:nowrap}
h1 span.sp{width:.32em}
h1 span{display:inline-block;transition:color .15s,transform .15s;will-change:transform}
.sub{margin-top:28px;max-width:34rem;color:var(--mute);font-size:clamp(1rem,1.6vw,1.2rem);font-weight:300}
.hint{position:absolute;bottom:28px;left:clamp(20px,5vw,56px);z-index:2;color:#4a5469;font-size:.85rem}
.now{position:absolute;right:clamp(20px,5vw,56px);bottom:28px;z-index:2;max-width:50%;text-align:right;color:#4a5469;font-size:.85rem}
.now a{color:var(--mute);text-decoration:none}.now a:hover{color:var(--blue)}
/* [END SEC CSS-A] */

/* [SEC CSS-B] 프로젝트·스킬·블로그 공통 스타일 */
section.s{padding:110px clamp(20px,5vw,56px);text-align:center}
h2{font-family:var(--display);font-size:.82rem;letter-spacing:.28em;text-transform:uppercase;font-weight:500;color:#5d6882}
.lead{color:var(--mute);margin:14px auto 0;max-width:34rem}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:32px 0 36px}
.chip{background:none;border:1px solid transparent;color:var(--mute);padding:7px 18px;border-radius:99px;font:inherit;font-size:.9rem;transition:background .35s,color .35s,border-color .35s}
.chip:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.chip.on{color:#d6e4ff;background:var(--blue-soft);border-color:rgba(47,123,255,.4)}
.chip small{opacity:.6;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;perspective:1100px}
.card{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;color:inherit;text-decoration:none;overflow:hidden;transition:transform .15s ease-out,border-color .25s;transform-style:preserve-3d}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(47,123,255,.2),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover{border-color:rgba(47,123,255,.55)}.card:hover::before{opacity:1}.card.hide{display:none}
.card h3{font-family:var(--display);font-size:1.4rem;font-weight:600;letter-spacing:-.02em;line-height:1.25;position:relative}
.card p{color:var(--mute);font-size:.93rem;margin-top:10px;position:relative;font-weight:300}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:22px;position:relative}
.tag{font-size:.78rem;color:#9db8ff;background:var(--blue-soft);padding:3px 11px;border-radius:99px}
.thumb{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0a0e16;border:1px solid var(--line)}
#bchips{position:relative;margin:32px 0 36px}.tree{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.tree path{fill:none;stroke:rgba(47,123,255,.5);stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;animation:dr .6s .05s ease-out forwards}
.rw{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;margin-top:30px;position:relative}#r1{margin-top:0}.rw:empty{display:none}.rw+.rw .chip{font-size:.84rem;padding:5px 14px;animation:fo .4s both}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fo{from{opacity:0}}@keyframes fi{from{opacity:0;transform:translateY(-6px)}}
.album .thumb{transition:opacity .24s,transform .24s,filter .24s}.cf-track.out .thumb{opacity:0;transform:translateY(-18px) scale(.94);filter:blur(8px)}
.album.in .thumb{animation:ai .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*55ms)}@keyframes ai{from{opacity:0;transform:translateY(28px) scale(.92);filter:blur(10px)}}
.cf-cap>*{animation:fi .4s both}
.skgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;perspective:1100px;max-width:1100px;margin:44px auto 0}
.sk{transition:transform .15s ease-out,border-color .25s,opacity .35s}.skgrid:hover .sk:not(:hover){opacity:.55}
.sk .no{display:block;position:relative;color:var(--blue);font-size:.78rem;letter-spacing:.12em;margin-bottom:10px}
.sk h3{font-size:1.15rem}.sn{display:block;margin-top:4px;color:#9db8ff;font-size:.78rem;position:relative}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;position:relative}
.pill{display:inline-block;font-size:.86rem;color:#b3bdd2;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:99px;padding:5px 14px;transition:color .25s,border-color .25s,background .25s,transform .25s}
.pill:hover{color:#fff;border-color:rgba(47,123,255,.7);background:var(--blue-soft);transform:translateY(-2px)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}.rv.vis{opacity:1;transform:none}
.rv .pill{opacity:0;transform:translateY(8px)}.rv.vis .pill{opacity:1;transform:none;transition:opacity .5s calc(.25s + var(--i)*50ms),transform .5s calc(.25s + var(--i)*50ms)}
@media(max-width:900px){.skgrid{grid-template-columns:1fr}.skgrid .sk{grid-column:auto!important}}
.acc{max-width:820px;margin:44px auto 0;text-align:left;border-top:1px solid var(--line)}
.ac{position:relative;border-bottom:1px solid var(--line);opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}.ac.vis{opacity:1;transform:none}
.ac::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--blue);transform:scaleX(0);transform-origin:0 50%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}.ac.open::after{transform:scaleX(1)}
.ah{width:100%;display:flex;align-items:center;gap:18px;padding:22px 4px;background:none;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ah .no{color:var(--blue);font-size:.78rem;letter-spacing:.12em;width:26px;flex:none}
.ah .nm{font-family:var(--display);font-size:clamp(1.05rem,2.2vw,1.4rem);font-weight:600;letter-spacing:-.02em;flex:none;transition:color .3s,transform .3s}.ah:hover .nm{color:#fff;transform:translateX(4px)}
.ah .nm small{margin-left:10px;color:#9db8ff;font-size:.75rem;font-weight:400;letter-spacing:0}
.ah .pv{flex:1;min-width:0;color:#566077;font-size:.88rem;font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}.ac.open .pv{opacity:0}
.ah .ct{color:#566077;font-size:.8rem;flex:none}
.ah .pm{position:relative;width:14px;height:14px;flex:none}.pm::before,.pm::after{content:"";position:absolute;left:0;top:6px;width:14px;height:1.5px;background:var(--mute);transition:transform .35s,background .3s}.pm::after{transform:rotate(90deg)}.ah:hover .pm::before,.ah:hover .pm::after{background:var(--blue)}.ac.open .pm::after{transform:rotate(0)}
.ab{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1)}.ac.open .ab{grid-template-rows:1fr}.ab>div{overflow:hidden;min-height:0}
.ab .pills{margin:0;padding:0 4px 26px 44px}
.ac .pill{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s,color .25s,border-color .25s,background .25s}
.ac.open .pill{opacity:1;transform:none;transition-delay:calc(.15s + var(--i)*45ms)}.ac.open .pill:hover{transform:translateY(-2px);transition-delay:0s}
@media(max-width:600px){.ah .pv{display:none}.ah .nm{flex:1}.ab .pills{padding-left:4px}}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.vz{width:100%;height:100%;display:block}.vz *{vector-effect:non-scaling-stroke}
.ln{fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-dasharray:1;animation:dd 4s ease-in-out infinite}
@keyframes dd{0%{stroke-dashoffset:1}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.gl{stroke:#121a2b;stroke-width:1}
.sp{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(24px,5vw,70px);max-width:1100px;margin:48px auto 0;align-items:center;min-height:380px;text-align:left}
.sp ul{list-style:none}.sp li{font-size:clamp(1.8rem,4.4vw,3.2rem);font-weight:300;letter-spacing:-.03em;line-height:1.25;color:#323c52;cursor:pointer;transition:color .35s,transform .35s,font-weight .35s;display:flex;align-items:baseline;gap:14px;outline:none}
.sp li small{font-size:.75rem;color:transparent;letter-spacing:.1em;transition:.35s}
.sp li:hover{color:#5d6882}.sp li.on{color:var(--ink);transform:translateX(10px);font-weight:500}.sp li.on small{color:var(--blue)}
.pn{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;min-height:360px;position:relative;overflow:hidden}
.pn::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at 80% 0%,rgba(47,123,255,.16),transparent 60%);pointer-events:none}
.pn>*{animation:fo2 .45s both;position:relative}.pn .v{height:170px;border-radius:14px;background:#080c14;border:1px solid var(--line);overflow:hidden;margin-bottom:20px;position:relative}
.pn h3{font-family:var(--display);font-size:1.6rem;font-weight:600;letter-spacing:-.02em}.pn p{color:var(--mute);margin:10px 0 20px;font-weight:300}.pn .more{margin-top:20px}
@keyframes fo2{from{opacity:0;transform:translateY(8px)}}
@media(max-width:800px){.sp{grid-template-columns:1fr}}
.arr{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:1.1rem;transition:all .2s;cursor:pointer}
.arr:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.cf{position:relative;height:clamp(330px,42vw,450px);margin:28px calc(-1*clamp(20px,5vw,56px)) 0;perspective:1300px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline:none;
-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.cf-track{position:absolute;inset:0;transform-style:preserve-3d}
.album{position:absolute;left:50%;top:42%;width:clamp(190px,22vw,270px);display:block;color:inherit;text-decoration:none;will-change:transform,opacity}
.album .thumb{aspect-ratio:1;border-radius:12px;-webkit-box-reflect:below 6px linear-gradient(transparent 62%,rgba(0,0,0,.4));box-shadow:0 20px 50px -22px rgba(47,123,255,.4)}
.album .thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.22),transparent 55%);opacity:0;transition:opacity .25s;pointer-events:none}
.album:hover .thumb::after{opacity:1}
.album img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;pointer-events:none}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:16px;text-align:left;background:linear-gradient(145deg,#0d1a33,#05080f 70%)}
.ph b{font-weight:300;font-size:2.4rem;line-height:1;letter-spacing:-.04em;color:var(--blue)}
.ph span{font-size:.95rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cf-ctl{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:8px;color:var(--mute);font-size:.9rem}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:6px}
.dots button{width:22px;height:22px;background:none;border:0;display:grid;place-items:center;cursor:pointer}
.dots button::before{content:"";width:6px;height:6px;border-radius:99px;background:#2a3550;transition:all .3s}
.dots button.on::before{width:20px;background:var(--blue)}
.cf-cap{max-width:36rem;min-height:8rem;margin:6px auto 0;text-align:center}
.cf-cap h3{font-family:var(--display);font-size:1.35rem;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.cf-cap h3 a{color:var(--ink);text-decoration:none}.cf-cap h3 a:hover{color:var(--blue)}
.cf-cap .m{margin-top:6px;font-size:.85rem;color:#566077}
.cf-cap p{margin-top:10px;font-size:.95rem;font-weight:300;color:var(--mute)}
.proj .ico{font-size:1.6rem;margin-bottom:18px;position:relative}
.more{display:inline-block;margin-top:30px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--blue);padding-bottom:2px;transition:color .2s}
.more:hover{color:var(--blue)}.more-wrap{text-align:center}
.mag{transition:transform .25s cubic-bezier(.2,.8,.2,1),color .2s,border-color .2s,background .2s!important}
footer{padding:60px clamp(20px,5vw,56px) 50px;color:#566077;font-size:.88rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
footer a{color:var(--mute);text-decoration:none}footer a:hover{color:var(--blue)}
a:focus-visible,button:focus-visible,.cf:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.ov{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}
.ov.open{opacity:1;pointer-events:auto}
.box{position:relative;text-align:left;width:min(520px,calc(100% - 40px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;transform:scale(.94) translateY(10px);transition:transform .3s}
.ov.open .box{transform:none}
.box .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:none;border:1px solid var(--line);color:var(--ink);font-size:1.1rem;cursor:pointer}
.box .ico{font-size:1.8rem;margin-bottom:14px}
.box h3{font-family:var(--display);font-size:1.6rem;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.box p{color:var(--mute);margin-top:12px;font-weight:300}
.box .meta{padding-top:18px;margin-top:0}
.box.p{padding:0;overflow:hidden;align-self:start;margin-top:16vh}
.box.p input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 22px;color:var(--ink);font:inherit;outline:none}
.box.p ul{list-style:none;padding:8px;max-height:50vh;overflow:auto}
.box.p li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:10px;color:var(--mute);font-size:.95rem;cursor:pointer}
.box.p li.on{background:var(--blue-soft);color:var(--ink)}
.box.p small{color:#566077;flex:none}
@media(max-width:600px){nav ul{gap:12px}.now{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
/* [END SEC CSS-B] */

/* [SEC CSS-C] 프로젝트 비주얼 애니메이션 (AI 러닝 코치 막대그래프 등) */
.bb{transform-box:fill-box;transform-origin:50% 100%;animation:gb 4s ease-in-out infinite;animation-delay:calc(var(--i)*.1s)}
@keyframes gb{0%{transform:scaleY(0)}25%,85%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
.tx{font-family:var(--body);font-size:5.5px;letter-spacing:.12em;fill:#566077}
.tv{font-family:var(--body);font-size:8px;font-weight:600;fill:#9db8ff}
/* [END SEC CSS-C] */

/* [SEC CSS-D] 배경음악 플레이어 스타일 (우상단 고정, 시크바·음량 포함) */
.bgm{position:fixed;top:72px;right:clamp(20px,5vw,56px);z-index:70;width:min(340px,calc(100% - 40px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 10px 40px -14px rgba(47,123,255,.35)}
.bgm-row{display:flex;align-items:center;gap:10px}
.bgm-ctl{display:flex;align-items:center;gap:6px;flex:none}
.bgm-btn{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--blue-soft);color:var(--ink);cursor:pointer;font-size:.8rem;display:grid;place-items:center;transition:border-color .2s}
.bgm-btn.sm{width:28px;height:28px;background:none;font-size:.7rem;color:var(--mute)}
.bgm-btn:hover{border-color:var(--blue)}
.bgm-btn:disabled{opacity:.4;cursor:default}

/* [SEC JS-B] 블로그 칩 필터, 글 렌더링, 티스토리 RSS 로드 */
const bgrid=document.getElementById('bgrid'),bchips=document.getElementById('bchips'),dots=document.getElementById('dots');
const TREE={major:[["SEMICONDUCTOR","Semiconductor",["semiconductor engineering","semiconductor manufacturing I","semiconductor manufacturing II","semiconductor process integration","semiconductor equipment interview"]],["SOFTWARE & AI","Software & AI",["digital image processing","machine learning & algorithms","DNN achitecture"]],["CIRCUITS & SYSTEMS","Circuits & Systems",["electronic circuits","microcontrollers"]],["SIGNALS & PROCESSING","Signals & Processing",["signals and systems","probability and random variables"]],["COMMUNICATIONS & RF","Communications & RF",["data communications","antenna engineering"]]],
others:[["PROJECTS","Projects",["capstone design"]],["LANGUAGE & PREP","Language & Prep",["TOIEC","TOIEC Speaking","OPIc"]],["TRENDS & BRIEFING","Trends & Briefing",["economy"]],["VEHICLE","Vehicle",["maintenance","tech"]],["FITNESS","Fitness",["running"]]]};
let tp='all',grp=null,sub=null;
const vis=()=>{
  let l=posts;
  if(tp!=='all'){const gs=TREE[tp].map(g=>g[0]);l=l.filter(p=>gs.includes(p.g));}
  if(grp)l=l.filter(p=>p.g===grp);
  if(sub)l=l.filter(p=>p.c===sub);
  if(l.length||tp==='all')return l;
  const g=grp&&TREE[tp].find(x=>x[0]===grp);
  return [{id:'category/'+(sub||grp||tp).split('/').map(encodeURIComponent).join('/'),ph:'\u2192',t:t('browse')+' '+(sub||(g?g[1]:tp==='major'?t('major'):t('others'))),d:'',g:grp||'',c:sub||(g?g[1]:tp),x:t('catHint')}];
};
function renderChips(){
  const c=(l,v,tx)=>`<button class="chip" data-l="${l}" data-v="${v}">${tx}</button>`;
  if(!bchips.firstChild)bchips.innerHTML=`<svg class="tree"></svg><div class="rw" id="r1">${c(1,'all',t('all'))}${c(1,'major',t('major'))}${c(1,'others',t('others'))}</div><div class="rw" id="r2"></div><div class="rw" id="r3"></div>`;
  const r2=document.getElementById('r2'),r3=document.getElementById('r3'),g=grp&&tp!=='all'&&TREE[tp].find(x=>x[0]===grp),k3=g&&g[2].length>1?grp:'';
  if(r2.dataset.k!==tp){r2.dataset.k=tp;r2.innerHTML=tp==='all'?'':TREE[tp].map(x=>c(2,x[0],x[1])).join('');}
  if(r3.dataset.k!==k3){r3.dataset.k=k3;r3.innerHTML=k3?g[2].map(x=>c(3,x,x)).join(''):'';}
  bchips.querySelectorAll('.chip').forEach(b=>{const l=+b.dataset.l,v=b.dataset.v;b.classList.toggle('on',l===1?v===tp:l===2?v===grp:v===sub);});
  drawTree();
}
function drawTree(){ /* 선택한 칩에서 하위 칩으로 이어지는 가지 */
  const sv=bchips.querySelector('.tree');if(!sv)return;
  const br=bchips.getBoundingClientRect(),rows=['r1','r2','r3'].map(i=>document.getElementById(i)).filter(r=>r.firstChild);let d='';
  const P=x=>`<path pathLength="1" d="${x}"/>`;
  for(let i=1;i<rows.length;i++){
    const p=rows[i-1].querySelector('.chip.on');if(!p)continue;
    const pr=p.getBoundingClientRect(),px=pr.left+pr.width/2-br.left,py=pr.bottom-br.top;
    const k=[...rows[i].children].map(e=>e.getBoundingClientRect()),ky=k[0].top-br.top,my=(py+ky)/2;
    const xs=k.filter(r=>Math.abs(r.top-br.top-ky)<4).map(r=>r.left+r.width/2-br.left);
    d+=P(`M${px} ${py+2}V${my}`)+P(`M${Math.min(px,...xs)} ${my}H${Math.max(px,...xs)}`)+xs.map(x=>P(`M${x} ${my}V${ky-2}`)).join('');
  }
  sv.innerHTML=d;
}
addEventListener('resize',drawTree);if(document.fonts)document.fonts.ready.then(drawTree);
bchips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const l=+b.dataset.l,v=b.dataset.v;
  if(l===1){tp=v;grp=sub=null;}else if(l===2){grp=grp===v?null:v;sub=null;}else sub=sub===v?null:v;

/* 티스토리 RSS에서 최신 글을 가져오고, 실패하면 위 내장 데이터를 그대로 사용 */
const gOf=cat=>{const p=cat.split('/'),l=p[p.length-1],f=[...TREE.major,...TREE.others].find(x=>x[0]===p[0]||x[0]===l||x[2].includes(l));return f?f[0]:p[0];};
const RSS='https://mo-bi.tistory.com/rss';
fetch(RSS).then(r=>r.text())

    const g=k=>(i.querySelector(k)||{}).textContent||'';

    const raw=doc.body.textContent.replace(/\s+/g,' ').trim(),im=doc.querySelector('img'),dt=new Date(g('pubDate'));
    return id?{id,t:g('title'),g:gOf(g('category')||'blog'),c:(g('category')||'blog').split('/').pop(),x:raw.slice(0,90)+'…',img:im?im.getAttribute('src'):'',d:`${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`}:null;

/* [SEC JS-C] 파란 커서, 타이틀 글자 반응, 히어로 입자 배경, 카드 기울기 */
const root=document.documentElement,dot=document.querySelector('.c-dot'),ring=document.querySelector('.c-ring');

/* 타이틀: 커서와 가까운 글자가 굵어지고 파랗게 */
const title=document.getElementById('title');
title.innerHTML='MO JUNHYUN'.split('').map(c=>c===' '?'<br>':`<span aria-hidden="true">${c}</span>`).join('');
const letters=[...title.children].filter(e=>e.tagName==='SPAN');
addEventListener('mousemove',e=>{

    const b=s.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2);

/* 히어로: 커서에 반응하는 입자 네트워크 */
const cv=document.getElementById('net'),cx=cv.getContext('2d');
let W,H,pts=[];const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function size(){W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight;
  pts=Array.from({length:Math.min(90,Math.floor(W*H/14000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}));}
size();addEventListener('resize',size);
let hx=-999,hy=-999;
addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();hx=e.clientX-r.left;hy=e.clientY-r.top;});
function draw(){
  cx.clearRect(0,0,W,H);
  for(const p of pts){
    if(!still){p.x+=p.vx;p.y+=p.vy;}
    if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    const dx=p.x-hx,dy=p.y-hy,d=Math.hypot(dx,dy);
    if(d<140&&d>0){p.x+=dx/d*(140-d)*.03;p.y+=dy/d*(140-d)*.03;}
    cx.fillStyle='rgba(47,123,255,.85)';cx.beginPath();cx.arc(p.x,p.y,1.8,0,6.283);cx.fill();
  }
  for(let i=0;i<pts.length;i++){
    const a=pts[i],dm=Math.hypot(a.x-hx,a.y-hy);
    if(dm<200){cx.strokeStyle=`rgba(80,150,255,${(1-dm/200)*.8})`;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(hx,hy);cx.stroke();}
    for(let j=i+1;j<pts.length;j++){
      const b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<120){cx.strokeStyle=`rgba(47,123,255,${(1-d/120)*.3})`;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();}
    }
  }
  requestAnimationFrame(draw);
}

/* [SEC JS-D] 블로그 Cover Flow: 관성 드래그, 휠, 화살표 키, 부드러운 정지 */
(function(){
  const cf=document.getElementById('cf'),cap=document.getElementById('cap');
  let items=[],n=0,pos=0,vel=0,target=null,drag=false,wheeling=false,raf=0,last=0;
  let moved=0,sx=0,sp=0,lx=0,lt=0,shown=-1,wt;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const unit=()=>(items[0]?items[0].offsetWidth:240)*.42;
  function showCap(k){
    shown=k;const p=vis()[k];if(!p)return;document.getElementById("cnt").textContent=`${k+1} / ${n}`;
    cap.innerHTML=`<h3><a href="https://mo-bi.tistory.com/${p.id}" target="_blank" rel="noopener">${p.t}</a></h3><div class="m">${p.d?p.d+' · ':''}${p.c}</div><p>${p.x}</p>`;
    [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===k));
  }
  function layout(){
    if(!n)return;
    const w=items[0].offsetWidth,near=w*.62,gap=w*.26;
    items.forEach((el,i)=>{
      const d=i-pos,ad=Math.abs(d),s=Math.sign(d),c=Math.min(ad,1);
      const x=ad<=1?d*near:s*(near+(ad-1)*gap);
      el.style.transform=`translate(-50%,-50%) translateX(${x}px) translateZ(${-c*160-Math.max(0,ad-1)*20}px) rotateY(${-s*c*58}deg)`;
      el.style.opacity=clamp(1-(ad-3)*.6,0,1);
      el.style.zIndex=1000-Math.round(ad*10);
      el.style.pointerEvents=ad>4?'none':'';
    });
    const k=clamp(Math.round(pos),0,n-1);
    if(k!==shown)showCap(k);
  }
  function tick(t){
    const dt=Math.min(40,t-last||16);last=t;
    if(!drag&&!wheeling){
      const max=n-1;
      if(target!==null){pos+=(target-pos)*(1-Math.exp(-dt/130));vel=0;if(Math.abs(target-pos)<.0008){pos=target;target=null;}}
      else if(Math.abs(vel)>.0005){pos+=vel*dt;vel*=Math.exp(-dt/380);if(pos<0||pos>max){target=clamp(pos,0,max);vel=0;}}
      else{vel=0;target=clamp(Math.round(pos),0,max);}
    }
    layout();
    raf=(drag||wheeling||target!==null||Math.abs(vel)>.0005)?requestAnimationFrame(tick):0;
  }
  const kick=()=>{if(!raf){last=performance.now();raf=requestAnimationFrame(tick);}};
  const go=d=>{if(!n)return;target=clamp(Math.round(target!==null?target:pos)+d,0,n-1);vel=0;kick();};
  window.cfTo=i=>{target=clamp(i,0,n-1);vel=0;kick();};
  cf.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    drag=true;moved=0;sx=lx=e.clientX;sp=pos;vel=0;target=null;lt=performance.now();kick();
  });
  addEventListener('pointermove',e=>{
    if(!drag)return;
    const now=performance.now(),dt=Math.max(1,now-lt),u=unit();
    vel=vel*.6+((lx-e.clientX)/u/dt)*.4;lx=e.clientX;lt=now;moved=Math.max(moved,Math.abs(e.clientX-sx));
    const raw=sp+(sx-e.clientX)/u,max=n-1;
    pos=raw<0?raw*.35:raw>max?max+(raw-max)*.35:raw;
  });
  function release(){if(!drag)return;drag=false;if(performance.now()-lt>90)vel=0;vel=clamp(vel,-.02,.02);kick();}
  addEventListener('pointerup',release);addEventListener('pointercancel',release);
  cf.addEventListener('click',e=>{
    const a=e.target.closest('.album');if(!a)return;
    if(moved>5){e.preventDefault();return;}
    const i=items.indexOf(a);
    if(i!==clamp(Math.round(pos),0,n-1)){e.preventDefault();target=i;vel=0;kick();}
  });
  cf.addEventListener('dragstart',e=>e.preventDefault());
  cf.addEventListener('wheel',e=>{
    const dx=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:(e.shiftKey?e.deltaY:0);
    if(!dx)return;
    e.preventDefault();target=null;vel=0;wheeling=true;
    pos=clamp(pos+dx/(unit()*1.3),-.3,n-.7);kick();
    clearTimeout(wt);wt=setTimeout(()=>{wheeling=false;kick();},120);
  },{passive:false});
  cf.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
    if(e.key==='ArrowRight'){e.preventDefault();go(1);}
  });
  document.getElementById('prev').onclick=()=>go(-1);
  document.getElementById('next').onclick=()=>go(1);
  cf.addEventListener('mousemove',e=>{const a=e.target.closest('.album');if(!a)return;const r=a.getBoundingClientRect();
    a.style.setProperty('--gx',(e.clientX-r.left)/r.width*100+'%');a.style.setProperty('--gy',(e.clientY-r.top)/r.height*100+'%');});
  addEventListener('resize',layout);
  window.cfRefresh=r=>{items=[...bgrid.children];n=items.length;pos=r?0:clamp(pos,0,Math.max(0,n-1));shown=-1;target=null;vel=0;layout();};
  cfRefresh();
})();

/* Swarm drone: 메인 드론이 타깃을 추적하고, LOCK 박스가 타깃을 계속 따라감 */
function drone(cv){
  const x=cv.getContext('2d'),w=cv.width=cv.offsetWidth*2||400,h=cv.height=cv.offsetHeight*2||260,u=h*.1;
  const OFF=[[-1.6,-1.2],[1.6,-1.2],[-.9,-2.3],[.9,-2.3]];
  const M=[w/2,h*.2],S=Array.from({length:4},()=>[Math.random()*w,Math.random()*h*.5]);
  const trail=[];let box=null;
  const rot=(p,r,a)=>{x.beginPath();x.arc(p[0],p[1],r,0,6.283);x.fill();
    x.strokeStyle=a;x.lineWidth=2;x.beginPath();x.moveTo(p[0]-r*1.9,p[1]);x.lineTo(p[0]+r*1.9,p[1]);x.stroke();};
  (function f(){
    if(!cv.isConnected)return;
    const t=performance.now()/1000;
    const T=[w/2+Math.sin(t*.7)*w*.3,h*.78];
    /* 검출값: 타깃 위치에 약간의 떨림을 더한 측정치 */
    const det=[T[0]+Math.sin(t*17)*u*.05,T[1]+Math.cos(t*13)*u*.04];
    if(!box)box=[T[0],T[1]];
    /* 추적 박스: 검출값을 지연 있게 따라감 (지수 평활) */
    box[0]+=(det[0]-box[0])*.1;box[1]+=(det[1]-box[1])*.1;
    trail.push([box[0],box[1]]);if(trail.length>36)trail.shift();
    const bw=u*1.1,bh=u*.8;
    M[0]+=(w/2+(box[0]-w/2)*.45-M[0])*.05;M[1]+=(h*.2+Math.sin(t*1.1)*h*.015-M[1])*.05;
    S.forEach((p,i)=>{p[0]+=(box[0]+OFF[i][0]*u-p[0])*.045;p[1]+=(box[1]+OFF[i][1]*u+Math.sin(t*2+i)*h*.01-p[1])*.045;});

    x.clearRect(0,0,w,h);
    x.strokeStyle='#121a2b';x.lineWidth=1.5;x.beginPath();x.moveTo(0,h*.88);x.lineTo(w,h*.88);x.stroke();

    /* 추적 궤적 */
    trail.forEach((q,i)=>{const k=i/trail.length;x.fillStyle=`rgba(47,123,255,${k*.5})`;x.beginPath();x.arc(q[0],q[1],1+u*.05*k,0,6.283);x.fill();});

    /* 카메라 시야 */
    x.fillStyle='rgba(47,123,255,.10)';x.beginPath();x.moveTo(M[0],M[1]);x.lineTo(box[0]-bw*.5,box[1]+bh*.5);x.lineTo(box[0]+bw*.5,box[1]+bh*.5);x.closePath();x.fill();

    /* 데이터 링크 */
    x.setLineDash([6,6]);x.strokeStyle='rgba(157,184,255,.45)';x.lineWidth=1.5;
    x.beginPath();x.moveTo(M[0],M[1]);x.lineTo(box[0],box[1]);x.stroke();
    S.forEach(p=>{x.beginPath();x.moveTo(M[0],M[1]);x.lineTo(p[0],p[1]);x.stroke();});
    x.setLineDash([]);

    /* 타깃 물체 */
    x.fillStyle='#1b3a73';x.fillRect(T[0]-u*.22,T[1]-u*.1,u*.44,u*.2);

    /* 검출 박스 (점선, 떨림) */
    x.setLineDash([4,4]);x.strokeStyle='rgba(157,184,255,.35)';x.lineWidth=1.5;
    x.strokeRect(det[0]-bw/2,det[1]-bh/2,bw,bh);x.setLineDash([]);

    /* 추적 박스 (코너 브라켓, 실선) */
    const bx=box[0]-bw/2,by=box[1]-bh/2,c=u*.2;
    x.strokeStyle='#2f7bff';x.lineWidth=2.5;
    [[bx,by,1,1],[bx+bw,by,-1,1],[bx,by+bh,1,-1],[bx+bw,by+bh,-1,-1]].forEach(([px,py,sx,sy])=>{
      x.beginPath();x.moveTo(px,py+sy*c);x.lineTo(px,py);x.lineTo(px+sx*c,py);x.stroke();});
    x.font='600 '+Math.round(u*.22)+'px sans-serif';x.fillStyle='#9db8ff';x.textAlign='left';
    x.fillText('LOCK 01',bx,by-u*.12);

    /* 드론 */
    x.fillStyle='#9db8ff';S.forEach(p=>rot(p,u*.16,'rgba(157,184,255,.6)'));
    x.fillStyle='#fff';rot(M,u*.26,'rgba(255,255,255,.7)');
    x.fillStyle='#2f7bff';x.beginPath();x.arc(M[0],M[1]+u*.05,u*.11,0,6.283);x.fill();
    x.font='600 '+Math.round(u*.3)+'px sans-serif';x.fillStyle='#566077';x.textAlign='center';
    x.fillText('MAIN · CAM',M[0],M[1]-u*.55);
    requestAnimationFrame(f);
  })();
}

/* [SEC JS-G] 배경음악 플레이어 (YouTube, 재생 버튼으로만 시작, 시크바·음량 포함) */
const BGM_START=[{id:'CJEgDVcFy80',title:''}];   /* 기본 곡 (자동재생 없음, 재생 버튼을 눌러야 시작) */
const bgmList=[...BGM_START];
let bgmIdx=0, ytPlayer=null, ytReady=false, bgmPlaying=false, loadedId=null;
let bgmVolume=30, bgmMuted=false, bgmSeeking=false, pendingPlay=false;

const $b=id=>document.getElementById(id);
const bgmPlayBtn=$b('bgmPlay'), bgmPrevBtn=$b('bgmPrev'), bgmNextBtn=$b('bgmNext'), bgmListBtn=$b('bgmListBtn');
const bgmBox=$b('bgm'), bgmTitle=$b('bgmTitle'), bgmSub=$b('bgmSub'), bgmForm=$b('bgmForm'), bgmUrl=$b('bgmUrl'), bgmItems=$b('bgmItems');
const bgmSeek=$b('bgmSeek'), bgmCur=$b('bgmCur'), bgmDur=$b('bgmDur'), bgmMute=$b('bgmMute'), bgmVol=$b('bgmVol');

function ytId(s){
  const m=s.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([\w-]{11})/);
  return m?m[1]:null;
}
function loadYT(cb){
  if(window.YT&&YT.Player)return cb();
  if(!document.getElementById('ytapi')){
    const s=document.createElement('script');
    s.id='ytapi';
    s.src='https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
  const prev=window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady=()=>{if(prev)prev();cb();};
}
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const curId=()=>bgmList[bgmIdx]&&bgmList[bgmIdx].id;

function setVolIcon(){
  bgmMute.textContent=(bgmMuted||bgmVolume===0)?'🔇':bgmVolume<50?'🔉':'🔊';
}

function renderBgm(){
  const cur=bgmList[bgmIdx];
  bgmTitle.textContent=cur?(cur.title||'제목 불러오는 중…'):'재생 목록이 비었어요';
  bgmSub.textContent=bgmList.length?`${bgmIdx+1} / ${bgmList.length}`:'링크를 추가해 주세요';
  bgmPlayBtn.disabled=!bgmList.length;
  bgmPrevBtn.disabled=bgmNextBtn.disabled=bgmList.length<2;
  bgmItems.innerHTML=bgmList.length?bgmList.map((tr,i)=>
    `<li data-i="${i}" class="${i===bgmIdx?'on':''}"><span class="nm">${i===bgmIdx&&bgmPlaying?'♪ ':''}${tr.title||tr.id}</span><button class="del" data-d="${i}" aria-label="삭제">✕</button></li>`).join('')
    :'<li class="bgm-empty">아직 추가된 곡이 없어요</li>';
}

/* 곡 전환: play가 true면 바로 재생, false면 준비만 하고 재생 버튼을 기다림 */
function goTo(i,play){
  if(!bgmList.length)return;
  bgmIdx=(i+bgmList.length)%bgmList.length;
  bgmCur.textContent='0:00';bgmDur.textContent='0:00';bgmSeek.value=0;
  renderBgm();
  if(!ytPlayer){
    pendingPlay=play;
    loadYT(()=>{if(!ytPlayer)createPlayer(curId());});
    return;
  }
  if(!ytReady){pendingPlay=play;return;}
  loadedId=curId();
  play?ytPlayer.loadVideoById(loadedId):ytPlayer.cueVideoById(loadedId);
}

function createPlayer(id){
  loadedId=id;
  ytPlayer=new YT.Player('bgmHost',{
    height:'1',
    width:'1',
    videoId:id,
    playerVars:{autoplay:0,controls:0,playsinline:1},
    events:{
      onReady:e=>{
        ytReady=true;
        e.target.setVolume(bgmVolume);
        bgmMuted?e.target.mute():e.target.unMute();
        if(curId()!==loadedId){loadedId=curId();e.target.cueVideoById(loadedId);}
        if(pendingPlay){pendingPlay=false;e.target.playVideo();}
        setVolIcon();
      },
      onStateChange:e=>{
        const S=YT.PlayerState;
        bgmPlaying=e.data===S.PLAYING;
        bgmPlayBtn.textContent=bgmPlaying?'❚❚':'▶';
        bgmPlayBtn.classList.toggle('on',bgmPlaying);
        if(e.data===S.ENDED)goTo(bgmIdx+1,true);
        const d=e.target.getVideoData&&e.target.getVideoData();
        const cur=bgmList[bgmIdx];
        if(d&&d.title&&cur&&d.video_id===cur.id&&cur.title!==d.title)cur.title=d.title;
        renderBgm();
      },
      onError:()=>{
        bgmSub.textContent='재생할 수 없는 영상이에요 · 다음 곡으로';
        setTimeout(()=>{if(bgmList.length>1)goTo(bgmIdx+1,bgmPlaying);},1200);
      }
    }
  });
}

/* 재생 버튼: 처음이면 재생 시작, 이후에는 재생/일시정지 토글 */
bgmPlayBtn.addEventListener('click',()=>{
  if(!ytPlayer||!ytReady){goTo(bgmIdx,true);return;}
  if(bgmPlaying){ytPlayer.pauseVideo();return;}
  if(loadedId!==curId()){loadedId=curId();ytPlayer.loadVideoById(loadedId);}
  else ytPlayer.playVideo();
});
bgmPrevBtn.addEventListener('click',()=>goTo(bgmIdx-1,bgmPlaying));
bgmNextBtn.addEventListener('click',()=>goTo(bgmIdx+1,bgmPlaying));
bgmListBtn.addEventListener('click',()=>bgmBox.classList.toggle('open'));

/* 시크바 */
setInterval(()=>{
  if(!ytPlayer||!ytReady||!ytPlayer.getDuration)return;
  const dur=ytPlayer.getDuration()||0,cur=ytPlayer.getCurrentTime()||0;
  bgmDur.textContent=fmt(dur);
  if(!bgmSeeking){bgmCur.textContent=fmt(cur);bgmSeek.value=dur?Math.round(cur/dur*1000):0;}
},500);
bgmSeek.addEventListener('input',()=>{
  bgmSeeking=true;
  const dur=ytReady?ytPlayer.getDuration():0;
  bgmCur.textContent=fmt(dur*bgmSeek.value/1000);
});
bgmSeek.addEventListener('change',()=>{
  if(ytReady){const dur=ytPlayer.getDuration()||0;ytPlayer.seekTo(dur*bgmSeek.value/1000,true);}
  bgmSeeking=false;
});

/* 음량 / 음소거 */
bgmVol.addEventListener('input',()=>{
  bgmVolume=+bgmVol.value;
  if(ytReady){
    ytPlayer.setVolume(bgmVolume);
    if(bgmVolume>0&&bgmMuted){bgmMuted=false;ytPlayer.unMute();}
  }
  setVolIcon();
});
bgmMute.addEventListener('click',()=>{
  bgmMuted=!bgmMuted;
  if(ytReady){bgmMuted?ytPlayer.mute():ytPlayer.unMute();}
  setVolIcon();
});

/* 목록 추가 / 선택 / 삭제 */
bgmForm.addEventListener('submit',e=>{
  e.preventDefault();
  const id=ytId(bgmUrl.value.trim());
  if(!id){
    bgmUrl.value='';
    bgmUrl.placeholder='올바른 유튜브 링크가 아니에요';
    return;
  }
  bgmList.push({id,title:''});
  bgmUrl.value='';
  bgmUrl.placeholder='유튜브 링크 추가';
  goTo(bgmList.length-1,false);
});
bgmItems.addEventListener('click',e=>{
  const del=e.target.closest('.del');
  if(del){
    const i=+del.dataset.d;
    bgmList.splice(i,1);
    if(!bgmList.length){
      if(ytReady)ytPlayer.stopVideo();
      bgmIdx=0;bgmPlaying=false;bgmPlayBtn.textContent='▶';
      renderBgm();return;
    }
    if(i<bgmIdx)bgmIdx--;
    else if(i===bgmIdx){
      bgmIdx=Math.min(i,bgmList.length-1);
      if(ytReady){loadedId=curId();ytPlayer.cueVideoById(loadedId);}
    }
    renderBgm();
    return;
  }
  const li=e.target.closest('li[data-i]');
  if(li)goTo(+li.dataset.i,bgmPlaying);
});

/* 초기화: 자동재생 없이 곡 정보만 미리 불러옴 */
bgmVol.value=bgmVolume;
setVolIcon();
renderBgm();
loadYT(()=>{if(!ytPlayer)createPlayer(curId());});
/* [END SEC JS-G] */

/* ---------- 초기 렌더링 (구역 밖, 수정 시 주의) ---------- */
applyStatic();
renderChips();
renderPosts(true);
</script>
